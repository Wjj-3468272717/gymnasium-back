nacos:
  config:
    server-addr: 127.0.0.1:8848
    type: yaml
    shared-configs:
      - dataId: gym-datasource.yaml
        group: DEFAULT_GROUP
      - dataId: gym-mybatis-plus.yaml
        group: DEFAULT_GROUP
      - dataId: gym-dubbo-common.yaml
        group: DEFAULT_GROUP

spring:
  application:
    name: gym-service-user

server:
  port: 8081

dubbo:
  application:
    name: gym-service-user
  protocol:
    port: 20881
  scan:
    base-packages: com.v1.service.user.provider
