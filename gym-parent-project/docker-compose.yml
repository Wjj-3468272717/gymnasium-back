# 帕梅拉酷我健身在线系统 - Docker Compose 部署
# 所有容器使用 host 网络（共享宿主机网络栈），容器间通过 127.0.0.1 互访
# 运行前提：先用 docker run maven 预编译出各服务的 jar（见 README 或部署手册）
services:
  # ================= 基础设施 =================
  mysql:
    image: mysql:8.0
    network_mode: host
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: gymnasium
      TZ: Asia/Shanghai
    volumes:
      - ./scripts/gym.sql:/docker-entrypoint-initdb.d/01-gym.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 40s
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:v1.4.2
    network_mode: host
    environment:
      MODE: standalone
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      # 仅检查 8848 端口已监听（nacos-init 内部会再轮询 readiness 接口）
      test: ["CMD", "bash", "-c", "(echo > /dev/tcp/127.0.0.1/8848) >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  nacos-init:
    build:
      context: .
      dockerfile: Dockerfile.nacos-init
    network_mode: host
    depends_on:
      nacos:
        condition: service_healthy
    restart: "no"

  minio:
    image: minio/minio
    network_mode: host
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # ================= 应用服务（Dubbo Provider + BFF） =================
  # 注意：Provider 必须使用 *-exec.jar；web 使用标准 jar
  gym-service-user:
    build:
      context: .
      args:
        JAR_FILE: gym-service-user/target/gym-service-user-1.0-SNAPSHOT-exec.jar
    image: gym-service-user:latest
    network_mode: host
    depends_on:
      mysql:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
    restart: unless-stopped

  gym-service-member:
    build:
      context: .
      args:
        JAR_FILE: gym-service-member/target/gym-service-member-1.0-SNAPSHOT-exec.jar
    image: gym-service-member:latest
    network_mode: host
    depends_on:
      mysql:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
    restart: unless-stopped

  gym-service-course:
    build:
      context: .
      args:
        JAR_FILE: gym-service-course/target/gym-service-course-1.0-SNAPSHOT-exec.jar
    image: gym-service-course:latest
    network_mode: host
    depends_on:
      mysql:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
    restart: unless-stopped

  gym-service-goods:
    build:
      context: .
      args:
        JAR_FILE: gym-service-goods/target/gym-service-goods-1.0-SNAPSHOT-exec.jar
    image: gym-service-goods:latest
    network_mode: host
    depends_on:
      mysql:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
    restart: unless-stopped

  gym-service-home:
    build:
      context: .
      args:
        JAR_FILE: gym-service-home/target/gym-service-home-1.0-SNAPSHOT-exec.jar
    image: gym-service-home:latest
    network_mode: host
    depends_on:
      mysql:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
    restart: unless-stopped

  gym-service-web:
    build:
      context: .
      args:
        JAR_FILE: gym-service-web/target/gym-service-web-1.0-SNAPSHOT.jar
    image: gym-service-web:latest
    network_mode: host
    depends_on:
      mysql:
        condition: service_healthy
      nacos-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mysql-data:
  nacos-data:
  minio-data:
