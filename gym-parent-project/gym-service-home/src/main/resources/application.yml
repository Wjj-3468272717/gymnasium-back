server:
  port: 8085

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/gymnasium?serverTimezone=Asia/Shanghai&characterEncoding=utf-8
    username: root
    password: 123456
  servlet:
    multipart:
      enabled: true
      max-file-size: 200MB
      max-request-size: 500MB

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml

dubbo:
  application:
    name: gym-service-home
  registry:
    address: nacos://127.0.0.1:8848
  protocol:
    name: dubbo
    port: 20885
  scan:
    base-packages: com.v1.service.home.provider

minio:
  endpoint: http://localhost:9000
  accessKey: minioadmin
  secretKey: minioadmin
